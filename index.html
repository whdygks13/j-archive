<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCHIVE</title>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @import url(https://fonts.googleapis.com/earlyaccess/nanummyeongjo.css);
    @import url(https://fonts.googleapis.com/css?family=Droid+Serif);
    * { margin:0; padding:0; line-height:140%; color:#555553; box-sizing: border-box; cursor: none !important; }
    ul { list-style:none; }
    body { font-size: 9pt; color: #999; font-family: '나눔명조', 'Nanum Myeongjo', serif; background: #ffffff; min-height: 100vh; overflow-x: hidden; }
    body.project, body.map-mode { overflow: hidden; } 
    a:link, a:visited, a:hover, a:active { text-decoration:none; color:#555553; }
    button, input, textarea, select { font: inherit; border: 0; background: transparent; }
    .eng { font-family:'Droid Serif', serif; letter-spacing:0; }
    
    /* ... (기존 스타일 동일 유지) ... */
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(255,255,255,0.95); border-bottom: 1px solid #f0f0f0; }
    .brand-name { font-size: 11pt; font-weight: normal; color: #555553; letter-spacing: 0.1em; }
    .add-project { font-size: 9pt; color: #555553; border: 1px solid #ddd; padding: 4px 10px; border-radius: 2px; }
    #wrapper { max-width:1200px; margin:100px auto; padding-bottom:50px; }
    #main_image_list li { width:200px; height:200px; float:left; position:relative; }
    #main_image_list li .picture img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .modal-layer { position: fixed; inset: 0; z-index: 1000; background: rgba(255,255,255,0.9); display: none; place-items: center; }
    .modal-layer.is-open { display: grid; }
    .project-modal { width: 440px; background: #fff; padding: 40px; border: 1px solid #ddd; display: grid; gap: 16px; }
  </style>
</head>
<body class="main">
  <!-- (기존 HTML 구조와 동일) -->
  <header class="topbar eng"><div class="brand"><div class="brand-name">ARCHIVE</div></div><button class="add-project" id="addProject">Add Project</button></header>
  <div id="wrapper"><ul id="main_image_list"><li class="gateway"><a href="javascript:void(0);" id="openMapBtn">·</a></li></ul></div>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = { /* 동일 */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 이미지 업로드 후 URL을 받아오는 함수
    async function uploadImageToStorage(file) {
      const storageRef = ref(storage, 'projects/' + crypto.randomUUID());
      const snapshot = await uploadBytes(storageRef, file);
      return await getDownloadURL(snapshot.ref);
    }

    // 프로젝트 생성 시
    document.getElementById("projectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("mainImageInput");
      const photoUrl = await uploadImageToStorage(fileInput.files[0]);
      
      const newProject = {
        id: crypto.randomUUID(),
        title: document.getElementById("buildingNameInput").value,
        architect: document.getElementById("architectInput").value,
        photo: photoUrl,
        items: []
      };
      projects.unshift(newProject);
      await saveProjects();
      renderProjects();
    });

    // ... (기타 로직 동일)
  </script>
</body>
</html>
